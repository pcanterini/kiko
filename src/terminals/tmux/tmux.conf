# Kiko's own tmux: `tmux -L kiko -f <this file>`, the server sessions run in so Kiko can
# type into them at any moment. Your ~/.tmux.conf isn't read and your own tmux isn't touched.
# Meant to feel like no tmux at all: no status bar, no prefix key, the mouse scrolls back, and
# Claude Code's keys and colours get through as in a plain terminal.
#
# A running server keeps the settings it started with. To pick up a change:
#   tmux -L kiko source-file <this file>     (sessions keep running)
#   tmux -L kiko kill-server                 (ends every session in it)

# No prefix key: Ctrl+B is Claude Code's own (run a command in the background), and nothing you
# type should be taken by tmux. Closing the window detaches: the session runs on, Kiko can still
# type into it, and `kiko attach` brings it back. For closing the window to end it instead, as a
# plain terminal does, uncomment the line after (and restart the server, see the top). Untried with
# Kiko: it ends any session no window shows, so maybe one Kiko opened before its window is up.
# Not with the Kiko window: there, no session's own tmux session is ever attached (the window
# shows their panes), so it would end them all.
set -g prefix None
set -g prefix2 None
unbind C-b
# set -g destroy-unattached on

# Nothing of its own on screen; the window's title is the pane's (Claude Code titles it with the
# conversation's title, as it does a plain terminal's), after "Kiko · " (tmux.ts TITLE_MARK): so
# Kiko never takes such a window for a plain terminal's session and types into it by its title.
# The Kiko window (`kiko`) has a status line, a look and a Ctrl+Space menu of its own:
# ./window.ts sets them on its own session, not here.
set -g status off
set -g set-titles on
set -g set-titles-string "Kiko · #{pane_title}"

# The mouse wheel scrolls back through the session (tmux's copy mode, left again by scrolling to the
# bottom), and a drag selects and copies to the clipboard; so does a double click (a word) or a
# triple one (the line), copied by copy-command. Lots of history: long sessions scroll far. The
# Kiko window's conversation views select the same way (./window.ts selectKeys).
set -g mouse on
set -g history-limit 100000
set -s set-clipboard on
set -s copy-command "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Keys as Claude Code expects them: Escape at once (it interrupts a turn), focus in and out,
# Shift+Enter and other modified keys when it asks for them.
set -s escape-time 0
set -g focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u

# Colours, links and the like: 24-bit colour inside, and what the usual Mac terminals can do outside.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:sync:usstyle:clipboard:focus"
set -as terminal-features ",xterm-kitty:RGB:extkeys:hyperlinks:sync:usstyle"
set -as terminal-features ",xterm-256color:RGB:hyperlinks"
setenv -g COLORTERM truecolor
# Escape sequences Claude Code sends straight to the terminal (notifications, images) get through.
set -g allow-passthrough on
